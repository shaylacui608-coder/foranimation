<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#fafbfc" />
    <title>确认装修效果</title>
    <link rel="stylesheet" href="./styles.css?v=optimize-2" />
  </head>
  <body>
    <main class="device" aria-label="确认装修效果页面">
      <header class="top-area">
        <div class="status-bar" aria-hidden="true">
          <span class="status-time">9:41</span>
          <span class="status-levels">
            <img src="../preview/assets/status-cellular.svg" alt="" width="20" height="13" />
            <img src="../preview/assets/status-wifi.svg" alt="" width="18" height="13" />
            <img src="../preview/assets/status-battery.svg" alt="" width="28" height="13" />
          </span>
        </div>

        <nav class="navbar" aria-label="页面导航">
          <button class="icon-button back-button" aria-label="返回">
            <img src="../preview/assets/nav-back.svg" alt="" />
          </button>
          <h1>确认装修效果</h1>
          <button class="review-button">
            <img src="../preview/assets/nav-add.svg" alt="" />
            <span>提交审核</span>
            <img src="../preview/assets/nav-right.svg" alt="" />
          </button>
        </nav>
      </header>

      <section class="step-area" aria-label="装修内容类型">
        <div class="step-control" role="tablist">
          <button class="step active completed" role="tab" aria-selected="true" data-tab="头图"><img src="../preview/assets/tab-check.svg" alt="" /><span>头图</span></button>
          <button class="step" role="tab" aria-selected="false" data-tab="相册"><img src="../preview/assets/tab-check.svg" alt="" /><span>相册</span></button>
          <button class="step" role="tab" aria-selected="false" data-tab="推荐菜"><img src="../preview/assets/tab-check.svg" alt="" /><span>推荐菜</span></button>
        </div>
      </section>

      <section class="preview-area" aria-label="头图预览">
        <div class="phone-frame">
          <div class="phone-shell">
            <div class="phone-panel head-panel active" data-panel="头图">
              <div class="detail-nav">
                <button aria-label="返回"><img src="../preview/assets/head-back.svg" alt="" /></button>
                <div class="detail-actions">
                  <button aria-label="分享"><img src="../preview/assets/head-share.svg" alt="" /></button>
                  <button aria-label="更多"><img src="../preview/assets/head-more.svg" alt="" /></button>
                </div>
              </div>

              <section class="detail-header">
                <div class="hero-banner">
                  <div class="hero-banner-triptych triptych" role="img" aria-label="Vanilla 烘培馆门店头图" data-preview="../preview/assets/head-option-1.webp" style="--triptych-art: url('../preview/assets/head-option-1.webp')">
                    <span></span><span></span><span></span>
                  </div>
                  <div class="hero-meta" aria-hidden="true">
                    <span class="hero-meta-active">封面</span>
                    <span>菜品</span>
                    <span>环境</span>
                    <i></i>
                    <span>1/228</span>
                  </div>
                </div>

                <div class="detail-info">
                  <div class="detail-title-row">
                    <h2>Vanilla 烘培馆</h2>
                    <button class="follow-button"><img src="../preview/assets/head-follow-plus.svg" alt="" />关注</button>
                  </div>
                  <div class="detail-rating">
                    <div class="diamonds" aria-label="4.5 分">
                      <img src="../preview/assets/diamond.svg" alt="" /><img src="../preview/assets/diamond.svg" alt="" /><img src="../preview/assets/diamond.svg" alt="" /><img src="../preview/assets/diamond.svg" alt="" /><img src="../preview/assets/diamond-half.svg" alt="" />
                    </div>
                    <span>4.5</span>
                  </div>
                  <span class="detail-placeholder detail-line-long"></span>
                  <span class="detail-placeholder detail-line-short"></span>
                  <div class="detail-location-row">
                    <div class="detail-location">
                      <p>海淀区中关村南大街27号魏公村街18楼</p>
                      <span>距你106米，步行3分钟</span>
                    </div>
                    <div class="round-placeholders"><span></span><span></span></div>
                  </div>
                </div>
              </section>

              <section class="detail-module">
                <span class="module-title-placeholder"></span>
                <div class="module-cards"><span></span><span></span><span></span></div>
              </section>
              <section class="detail-module">
                <span class="module-title-placeholder"></span>
                <div class="module-cards"><span></span><span></span><span></span></div>
              </section>
            </div>

            <div class="phone-panel album-panel" data-panel="相册" hidden>
              <div class="album-nav">
                <button aria-label="返回"><img src="../preview/assets/album-back.svg" alt="" /></button>
                <h2>门店相册</h2>
              </div>

              <div class="album-category" role="tablist" aria-label="相册分类">
                <button class="active" role="tab" aria-selected="true">全部 (12)</button>
                <button role="tab" aria-selected="false">店内环境(5)</button>
                <button role="tab" aria-selected="false">店外环境(7)</button>
              </div>

              <div class="album-grid">
                <figure class="album-item" data-album-id="1"><img src="../preview/assets/album-01.webp" alt="面包" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item" data-album-id="2"><img src="../preview/assets/album-02.webp" alt="烘培馆陈列" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item" data-album-id="3"><img src="../preview/assets/album-03.webp" alt="店内环境" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item" data-album-id="4"><img src="../preview/assets/album-04.webp" alt="门店外景" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item" data-album-id="5"><img src="../preview/assets/album-05.webp" alt="面包包装" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item" data-album-id="6"><img src="../preview/assets/album-06.webp" alt="店内陈列" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item" data-album-id="7"><img src="../preview/assets/album-07.webp" alt="门店图片" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item" data-album-id="8"><img src="../preview/assets/album-08.webp" alt="门店图片" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item crop-nine" data-album-id="9"><img src="../preview/assets/album-09.webp" alt="门店图片" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
                <figure class="album-item crop-ten" data-album-id="10"><img src="../preview/assets/album-10.webp" alt="门店图片" /><span class="drag-badge"><img src="../preview/assets/album-drag.svg" alt="" /></span></figure>
              </div>
            </div>

            <div class="phone-panel recommend-panel" data-panel="推荐菜" hidden>
              <section class="recommend-top-skeleton" aria-hidden="true">
                <span></span>
                <span></span>
              </section>

              <section class="dish-section">
                <div class="dish-heading">
                  <h2><img src="../preview/assets/dish-title-mark.svg" alt="" />用户推荐菜<span>(20)</span></h2>
                  <i aria-hidden="true"></i>
                </div>

                <div class="dish-row">
                  <article class="dish-card" data-dish-id="baguette">
                    <img src="../preview/assets/dish-baguette.webp" alt="法式面包" />
                    <h3>法式面包</h3>
                    <span></span>
                  </article>
                  <article class="dish-card" data-dish-id="croissant">
                    <img src="../preview/assets/dish-croissant.webp" alt="可颂" />
                    <h3>可颂</h3>
                    <span></span>
                  </article>
                  <article class="dish-card" data-dish-id="sandwich">
                    <img src="../preview/assets/dish-sandwich.webp" alt="美式三明治" />
                    <h3>美式三明治</h3>
                    <span></span>
                  </article>
                  <article class="dish-card" data-dish-id="tripe">
                    <img src="../preview/assets/dish-tripe.webp" alt="火锅毛肚" />
                    <h3>火锅毛肚</h3>
                    <span></span>
                  </article>
                </div>
              </section>

              <section class="recommend-placeholder-module" aria-hidden="true">
                <span class="recommend-module-title"></span>
                <div><i></i><i></i><i></i></div>
              </section>
              <section class="recommend-placeholder-module" aria-hidden="true">
                <span class="recommend-module-title"></span>
                <div><i></i><i></i><i></i></div>
              </section>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer-area">
        <button class="compare-button" type="button" aria-label="对比原图与优化效果">◧</button>
        <button class="edit-button"><img src="../preview/assets/edit.svg" alt="" /><span>编辑内容</span></button>
      </footer>

      <div class="home-indicator" aria-hidden="true"><span></span></div>

      <section class="edit-sheet" data-mode="head" aria-label="编辑图片" aria-hidden="true">
        <div class="edit-toolbar">
          <button class="edit-cancel" aria-label="取消编辑"><img src="../preview/assets/edit-close.svg" alt="" /></button>
          <h2 class="edit-title">门店头图</h2>
          <button class="edit-confirm" aria-label="完成编辑"><img src="../preview/assets/edit-confirm.svg" alt="" /></button>
        </div>
        <div class="optimization-sheet-body"></div>
        <div class="edit-home-indicator" aria-hidden="true"><span></span></div>
      </section>
    </main>
    <script src="./script.js?v=optimize-2"></script>
  </body>
</html>
